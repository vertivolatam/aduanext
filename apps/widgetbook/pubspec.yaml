name: aduanext_widgetbook
description: "Catálogo de widgets de AduaNext con Widgetbook — taxonomía Atomic Design."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  widgetbook_annotation: ^3.10.0
  widgetbook: ^3.21.0
  aduanext_mobile:
    path: ../mobile
  aduanext_domain:
    path: ../../libs/domain
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  widgetbook_generator: ^3.21.0

flutter:
  uses-material-design: true
